# Official sources LINA fetches from (SPEC §6.1).
#
# How this file works
#   - Edit here, then run:  uv run python -m lina.pipeline sync
#   - Nothing is fetched from a source until it has `verified: true`. Only the owner sets that,
#     after reading the site's terms of use and checking that the listing URL is the right page.
#   - `uv run python -m lina.pipeline check --probe` checks each site's robots.txt and whether the
#     listing loads. Results are stored in the database, not written back here.
#   - Removing an entry switches the source off; its history stays in the database.
#
# Fields
#   key              permanent id (lowercase-with-dashes). Never rename.
#   kind             rss | html_list | sitemap | manual
#   default_type     the opportunity type most items here have (optional)
#   country          ISO code if the source is national; omit for international programmes
#   fetch_frequency  daily (default) | weekly
#   parsing_hints    item_selector (CSS selector for the item links), url_pattern (regex),
#                    allowed_domains (other official domains items may live on), max_items
#
# Only official pages belong here: the organization's own site or an official portal.
# No job boards, opportunity blogs or LinkedIn (SPEC §2).
#
# Every entry below is a PROPOSAL. Each site's robots.txt was checked and its page loaded once
# on 2026-11-15 (see the notes). Terms of use were NOT read; that is part of verifying a source.

